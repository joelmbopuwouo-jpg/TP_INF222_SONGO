<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Accueil - Jeu de Songo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .welcome-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h1 { color: #8B5A2B; margin-bottom: 10px; font-size: 2.5rem; }
        .subtitle { color: #666; margin-bottom: 30px; font-size: 1.1rem; }
        .section-title { font-size: 1rem; color: #333; text-transform: uppercase; letter-spacing: 1px; margin-top: 25px; margin-bottom: 15px; font-weight: bold; }
        .btn { display: block; padding: 14px 20px; margin: 10px 0; color: white; text-decoration: none; font-weight: bold; font-size: 1.1rem; border-radius: 10px; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.15); }
        .btn-mode-ia { background-color: #9b59b6; }
        .btn-local { background-color: #e67e22; }
        .btn-distant-south { background-color: #2ecc71; }
        .btn-distant-north { background-color: #3498db; }
        .footer-note { margin-top: 30px; font-size: 0.85rem; color: #aaa; }
    </style>
</head>
<body>

    <div class="welcome-container">
        <h1>Jeu de Songo</h1>
        <p class="subtitle">Projet Académique - Plateforme de Jeu</p>
        
        <hr style="border: 0; height: 1px; background: #eee; margin: 20px 0;">

        <div class="section-title">Partie sur le même PC</div>
        <a href="jeu.html?mode=ia" class="btn btn-media-ia" style="background: #9b59b6 !important; color: white !important;">Jouer Contre l'IA (ordinateur)</a>
        <a href="jeu.html?mode=local" class="btn btn-local">Lancer le Mode Local</a>

        <div class="section-title">Partie en Réseau (Distant)</div>
        <a href="jeu.html?mode=distant&role=south" class="btn btn-distant-south">Rejoindre comme Joueur SUD</a>
        <a href="jeu.html?mode=distant&role=north" class="btn btn-distant-north">Rejoindre comme Joueur NORD</a>

        <div class="footer-note">Développé dans le cadre du TP Songo.</div>
    </div>

</body>
</html>
